# Upptime configuration for the public status page (Build plan I7; design
# doc, "Independence rule": the status page lives on GitHub, not AWS).
# This file is the source; it's copied into the rparelius/area0-status
# repository, made from the upptime/upptime template (README.md here).
owner: rparelius
repo: area0-status

sites:
  - name: Web app (dev)
    url: https://d3uausgfzyi2fu.cloudfront.net/
  - name: API (dev)
    url: https://d3uausgfzyi2fu.cloudfront.net/v1/tenants/lookup?slug=acme
  - name: Query API (dev)
    url: https://d3uausgfzyi2fu.cloudfront.net/metrics/api/v1/query
    expectedStatusCodes:
      - 401

status-website:
  # Until status.area0.co points here (a CNAME in envs/org).
  baseUrl: /area0-status
  name: Area0 status
  introTitle: "**Area0** service status"
  introMessage: Checked every five minutes from GitHub, outside our own infrastructure. Pages are sent separately, from our monitoring account.
  navbar:
    - title: Status
      href: /
